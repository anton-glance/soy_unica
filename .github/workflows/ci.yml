name: CI

on:
  push:
  pull_request:

# Una corrida por rama: un push nuevo cancela la anterior, que ya no interesa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # La versión del repo: .nvmrc manda, y package.json#engines la exige.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Las pruebas levantan un `wrangler dev` real contra D1 y R2 locales.
      - name: Tests
        run: npm test
