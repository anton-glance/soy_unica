<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- El prototipo define paleta clara y oscura; las dos van en tokens.css. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FBF7F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221C1E" media="(prefers-color-scheme: dark)" />
    <!--
      Los tres salen del mismo archivo de marca (docs/brand/favicon-300.png).
      El .ico existe porque el navegador pide /favicon.ico por su cuenta, aunque
      haya otro enlace: sin él esa petición caía en el index.html del SPA y
      devolvía HTML donde se esperaba un icono.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Soy Única Novias</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
